name: Generate and deploy scverse stats

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run Mondays and Thursdays at 06:00 UTC to get fresh stats
    - cron: "0 6 * * 1,4"

env:
  AWS_REGION: eu-west-1
  STATS_BUCKET: scverse-stats-dev

jobs:
  generate-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate scverse stats
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GH_TOKEN }}
          ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
          ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
          ZULIP_REALM: ${{ secrets.ZULIP_REALM }}
          PEPY_API_KEY: ${{ secrets.PEPY_API_KEY }}
        run: |
          npm start

      - name: Check if stats.json exists and is valid
        run: |
          if [ ! -s output/stats.json ]; then
            echo "Error: stats.json is empty or does not exist"
            exit 1
          fi
          # Validate JSON syntax
          jq empty output/stats.json

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish stats to S3
        if: github.ref == 'refs/heads/main'
        run: aws s3 sync output/ "s3://${STATS_BUCKET}/" --exclude "index.html"

  trigger-website-build:
    runs-on: ubuntu-latest
    needs: generate-data

    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger website build
        run: |
          curl -XPOST \
          -u "scverse-bot:${{ secrets.BOT_GH_TOKEN }}" \
          -H "Accept: application/vnd.github.everest-preview+json" \
          -H "Content-Type: application/json" \
          https://api.github.com/repos/scverse/scverse.github.io/actions/workflows/gh-pages.yml/dispatches \
          --data '{"ref": "main"}'

  keepalive-job:
    name: Keepalive Workflow
    runs-on: ubuntu-slim
    permissions:
      actions: write
    steps:
      - name: Re-enable workflow
        env:
          GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN || github.token }}
        shell: sh
        run: |
          gh api --verbose -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yaml/enable"
